version: '3.8'

services:
  agent-evaluator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cognitive-agent-evaluator
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
